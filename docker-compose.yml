services:
  cv-tailor:
    build: .
    image: cv-tailor
    # Run as your own user so files in outputs/ belong to you.
    # Set UID and GID in .env, or run: UID=$(id -u) GID=$(id -g) docker compose up
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8765:8765"   # only reachable from this machine
    volumes:
      - ./inputs:/app/inputs
      - ./outputs:/app/outputs
      - opencode-home:/data/home   # OpenCode login, sessions and cache
    # Optional: provider API keys (for example GOOGLE_GENERATIVE_AI_API_KEY,
    # OPENAI_API_KEY, ANTHROPIC_API_KEY) and GITHUB_TOKEN.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  opencode-home:
